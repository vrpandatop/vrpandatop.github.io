<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SpotiBox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0b0b;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* === ГЛАВНЫЙ ЛЕЙАУТ === */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* --- ЛЕВЫЙ САЙДБАР --- */
    .sidebar {
      width: 240px;
      background-color: #000;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
      padding: 0 10px 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #1ed760;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #b3b3b3;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      color: #fff;
    }

    .nav-btn.active {
      background: #282828;
      color: #fff;
    }

    .upload-box {
      margin-top: auto;
      background: #181818;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      border: 1px dashed #333;
    }

    .upload-box small {
      color: #888;
      font-size: 11px;
    }

    /* --- ЦЕНТРАЛЬНЫЙ КОНТЕНТ --- */
    .main-view {
      flex: 1;
      background: #121212;
      overflow-y: auto;
      padding: 24px;
    }

    .tab-view {
      display: none;
    }

    .tab-view.active {
      display: block;
    }

    h2 {
      margin: 20px 0 14px;
      font-size: 22px;
    }

    /* Сетка "Добрый день" */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .quick-card {
      background: #2a2a2a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      overflow: hidden;
      transition: background 0.2s;
    }

    .quick-card:hover {
      background: #383838;
    }

    .quick-card img {
      width: 56px;
      height: 56px;
      object-fit: cover;
    }

    /* Сетка карточек */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .track-card {
      background: #181818;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .track-card:hover {
      background: #282828;
    }

    .track-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .track-card .title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-card .artist {
      font-size: 12px;
      color: #a7a7a7;
      margin-top: 4px;
    }

    /* Поиск и Плейлист */
    .search-input {
      width: 100%;
      max-width: 450px;
      padding: 12px 18px;
      border-radius: 25px;
      border: none;
      background: #242424;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 20px;
    }

    /* --- ПРАВАЯ ПАНЕЛЬ ТРЕКА --- */
    .right-sidebar {
      width: 340px;
      background-color: #121212;
      border-left: 1px solid #282828;
      padding: 16px;
      overflow-y: auto;
      display: none; /* Скрыта, пока ничего не играет */
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .right-sidebar.visible {
      display: flex;
    }

    .right-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #a7a7a7;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .close-btn:hover {
      color: #fff;
    }

    .rs-cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
    }

    .lyrics-card {
      background: #2e3e23;
      padding: 16px;
      border-radius: 8px;
    }

    .lyrics-card h4 {
      font-size: 12px;
      color: #a5d48a;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .about-card {
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }

    .about-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .about-content {
      padding: 14px;
    }

    /* --- НИЖНИЙ ПЛЕЕР --- */
    .bottom-player {
      height: 80px;
      background: #181818;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 25%;
    }

    .player-left img {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      object-fit: cover;
    }

    .player-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 50%;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .btn-circle {
      width: 36px;
      height: 36px;
      background: #fff;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #000;
      font-size: 14px;
    }

    .progress-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #a7a7a7;
    }

    .progress-bar input[type="range"], .player-right input[type="range"] {
      flex: 1;
      accent-color: #1ed760;
      cursor: pointer;
    }

    .player-right {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 25%;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ЛЕВАЯ ПАНЕЛЬ: МЕНЮ -->
    <nav class="sidebar">
      <div class="logo">
        <div class="logo-icon">≈</div>
        SpotiBox
      </div>
      <button class="nav-btn active" data-tab="tab-home">🏠 Главная</button>
      <button class="nav-btn" data-tab="tab-youtube">▶ Поиск YouTube</button>
      <button class="nav-btn" data-tab="tab-playlist">💿 Мой плейлист</button>

      <div class="upload-box">
        ☁ Загрузить MP3<br>
        <small>Без ограничений и сети</small>
      </div>
    </nav>

    <!-- ЦЕНТР: КОНТЕНТНЫЕ СТРАНИЦЫ -->
    <main class="main-view">
      
      <!-- ВКЛАДКА: ГЛАВНАЯ -->
      <section id="tab-home" class="tab-view active">
        <h2>Добрый день</h2>
        <div class="quick-grid" id="quick-grid"></div>

        <h2>Рекомендуем сегодня</h2>
        <div class="cards-grid" id="recommend-grid"></div>

        <h2>Хиты и новинки</h2>
        <div class="cards-grid" id="hits-grid"></div>
      </section>

      <!-- ВКЛАДКА: ПОИСК YOUTUBE -->
      <section id="tab-youtube" class="tab-view">
        <h2>Поиск YouTube</h2>
        <input type="text" class="search-input" id="yt-search-input" placeholder="Введите название песни или исполнителя...">
        <div class="cards-grid" id="yt-results">
          <!-- Результаты поиска загружаются сюда -->
        </div>
      </section>

      <!-- ВКЛАДКА: МОЙ ПЛЕЙЛИСТ -->
      <section id="tab-playlist" class="tab-view">
        <h2>Мой плейлист</h2>
        <div class="cards-grid" id="playlist-grid">
          <!-- Сохраненные треки -->
        </div>
      </section>

    </main>

    <!-- ПРАВАЯ ПАНЕЛЬ: КАРТОЧКА ТЕКУЩЕГО ТРЕКА -->
    <aside class="right-sidebar" id="right-sidebar">
      <div class="right-header">
        <span style="font-weight: bold; font-size: 14px;">Сейчас играет</span>
        <button class="close-btn" id="close-sidebar-btn" title="Закрыть панель">✕</button>
      </div>

      <img src="" id="rs-cover" class="rs-cover" alt="Обложка">
      
      <div>
        <h3 id="rs-title" style="font-size: 18px;"></h3>
        <p id="rs-artist" style="color: #a7a7a7; font-size: 13px; margin-top: 4px;"></p>
      </div>

      <!-- Предпросмотр текста -->
      <div class="lyrics-card">
        <h4>Предпросмотр текста</h4>
        <p id="rs-lyrics" style="font-size: 14px; font-weight: 600; line-height: 1.4;"></p>
      </div>

      <!-- Об исполнителе -->
      <div class="about-card">
        <img src="" id="rs-artist-img" alt="Фото артиста">
        <div class="about-content">
          <h4 id="rs-about-name" style="margin-bottom: 4px;"></h4>
          <p id="rs-listeners" style="font-size: 11px; color: #a7a7a7; margin-bottom: 8px;"></p>
          <p id="rs-bio" style="font-size: 12px; color: #ccc; line-height: 1.4;"></p>
        </div>
      </div>
    </aside>
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ: ПЛЕЕР -->
  <footer class="bottom-player">
    <div class="player-left">
      <img src="https://via.placeholder.com/52" id="bp-cover" alt="">
      <div>
        <div id="bp-title" style="font-size: 13px; font-weight: bold;">Не выбран</div>
        <div id="bp-artist" style="font-size: 11px; color: #a7a7a7;">—</div>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button style="background:none;border:none;color:#a7a7a7;cursor:pointer;">🔀</button>
        <button style="background:none;border:none;color:#fff;cursor:pointer;">⏮</button>
        <button class="btn-circle" id="play-pause-btn">▶</button>
        <button style="background:none;border:none;color:#fff;cursor:pointer;">⏭</button>
        <button style="background:none;border:none;color:#a7a7a7;cursor:pointer;">🔁</button>
      </div>
      <div class="progress-bar">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-slider" min="0" max="100" value="0">
        <span id="total-time">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <span style="font-size: 12px; background: #282828; padding: 4px 8px; border-radius: 12px;">Визуал: Xbox Tunnel</span>
      <span>🔊</span>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" style="width: 80px;">
    </div>
  </footer>

  <script>
    // 1. БАЗА ТРЕКОВ
    const tracks = [
      {
        id: 1,
        title: "Почти всегда",
        artist: "Kuznetsky Squad",
        cover: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400&auto=format&fit=crop&q=60",
        audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        lyrics: "Мы сливаем бабки чаще, чем почти всегда\nПокупаем тряпки, но не...",
        artistBio: "Популярный хип-хоп проект с драйвовыми битами и узнаваемым стилем.",
        listeners: "324 190 слушателей за месяц",
        artistImg: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&auto=format&fit=crop&q=60"
      },
      {
        id: 2,
        title: "MF DOOM - One Beer",
        artist: "MF DOOM",
        cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&auto=format&fit=crop&q=60",
        audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        lyrics: "There's only one beer left, rappers screaming all in our ears like we're deaf...",
        artistBio: "Легендарный хип-хоп продюсер и артист в маске, определивший звучание андерграунда.",
        listeners: "4 892 110 слушателей за месяц",
        artistImg: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&auto=format&fit=crop&q=60"
      },
      {
        id: 3,
        title: "Synthwave Chill Radio",
        artist: "Lofi Girl",
        cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&auto=format&fit=crop&q=60",
        audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
        lyrics: "Инструментальный ретровейв / Без слов",
        artistBio: "Лейбл и бесконечный радиопоток для работы, отдыха и учёбы.",
        listeners: "12 400 000 слушателей за месяц",
        artistImg: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400&auto=format&fit=crop&q=60"
      },
      {
        id: 4,
        title: "Cyberpunk 2077 - The Rebel Path",
        artist: "P.T. Adamczyk",
        cover: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&auto=format&fit=crop&q=60",
        audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
        lyrics: "Саундтрек Джонни Сильверхенда к бунту в Найт-Сити.",
        artistBio: "Штатный композитор CD Projekt RED, создатель культовой электроники.",
        listeners: "890 000 слушателей за месяц",
        artistImg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&auto=format&fit=crop&q=60"
      }
    ];

    // Аудио элемент
    const audio = new Audio();
    let currentTrack = null;

    // 2. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (Главная / YouTube / Плейлист)
    const navButtons = document.querySelectorAll('.nav-btn');
    const tabViews = document.querySelectorAll('.tab-view');

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        navButtons.forEach(b => b.classList.remove('active'));
        tabViews.forEach(t => t.classList.remove('active'));

        btn.classList.add('active');
        const targetTabId = btn.getAttribute('data-tab');
        document.getElementById(targetTabId).classList.add('active');
      });
    });

    // 3. ОТРИСОВКА КАРТОЧЕК НА ГЛАВНОМ ЭКРАНЕ
    function renderHome() {
      const quickGrid = document.getElementById('quick-grid');
      const recommendGrid = document.getElementById('recommend-grid');
      const hitsGrid = document.getElementById('hits-grid');

      quickGrid.innerHTML = '';
      recommendGrid.innerHTML = '';
      hitsGrid.innerHTML = '';

      tracks.forEach(track => {
        // Карточки для «Добрый день»
        const quickCard = document.createElement('div');
        quickCard.className = 'quick-card';
        quickCard.innerHTML = `<img src="${track.cover}"> <span style="font-size:13px; font-weight:bold;">${track.title}</span>`;
        quickCard.onclick = () => playTrack(track);
        quickGrid.appendChild(quickCard);

        // Карточки для «Рекомендуем сегодня»
        const recCard = createGridCard(track);
        recommendGrid.appendChild(recCard);

        // Карточки для «Хиты»
        const hitCard = createGridCard(track);
        hitsGrid.appendChild(hitCard);
      });
    }

    function createGridCard(track) {
      const card = document.createElement('div');
      card.className = 'track-card';
      card.innerHTML = `
        <img src="${track.cover}">
        <div class="title">${track.title}</div>
        <div class="artist">${track.artist}</div>
      `;
      card.onclick = () => playTrack(track);
      return card;
    }

    // 4. ЗАПУСК ТРЕКА + ОБНОВЛЕНИЕ ПРАВОЙ ПАНЕЛИ
    function playTrack(track) {
      currentTrack = track;

      // Аудио поток
      audio.src = track.audioUrl;
      audio.play();
      document.getElementById('play-pause-btn').textContent = '⏸';

      // Обновляем плеер снизу
      document.getElementById('bp-cover').src = track.cover;
      document.getElementById('bp-title').textContent = track.title;
      document.getElementById('bp-artist').textContent = track.artist;

      // ОТКРЫВАЕМ И ЗАПОЛНЯЕМ ПРАВУЮ КАРТОЧКУ ТРЕКА
      const rightSidebar = document.getElementById('right-sidebar');
      rightSidebar.classList.add('visible'); // Делаем видимой

      document.getElementById('rs-cover').src = track.cover;
      document.getElementById('rs-title').textContent = track.title;
      document.getElementById('rs-artist').textContent = track.artist;
      document.getElementById('rs-lyrics').textContent = track.lyrics;
      document.getElementById('rs-artist-img').src = track.artistImg;
      document.getElementById('rs-about-name').textContent = track.artist;
      document.getElementById('rs-listeners').textContent = track.listeners;
      document.getElementById('rs-bio').textContent = track.artistBio;
    }

    // Закрытие правой панели
    document.getElementById('close-sidebar-btn').addEventListener('click', () => {
      document.getElementById('right-sidebar').classList.remove('visible');
    });

    // 5. УПРАВЛЕНИЕ ПЛЕЕРОМ (Play/Pause, Slider, Громкость)
    const playPauseBtn = document.getElementById('play-pause-btn');
    playPauseBtn.addEventListener('click', () => {
      if (!currentTrack) {
        if (tracks.length > 0) playTrack(tracks[0]);
        return;
      }
      if (audio.paused) {
        audio.play();
        playPauseBtn.textContent = '⏸';
      } else {
        audio.pause();
        playPauseBtn.textContent = '▶';
      }
    });

    const seekSlider = document.getElementById('seek-slider');
    const currentTimeEl = document.getElementById('current-time');
    const totalTimeEl = document.getElementById('total-time');

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        seekSlider.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        totalTimeEl.textContent = formatTime(audio.duration);
      }
    });

    seekSlider.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (seekSlider.value / 100) * audio.duration;
      }
    });

    document.getElementById('volume-slider').addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // 6. ПОИСК YOUTUBE (Пример поиска по массиву/YouTube API)
    const searchInput = document.getElementById('yt-search-input');
    const ytResults = document.getElementById('yt-results');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      ytResults.innerHTML = '';
      if (!q) return;

      const filtered = tracks.filter(t => 
        t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        ytResults.innerHTML = '<p style="color:#888;">Ничего не найдено</p>';
      } else {
        filtered.forEach(track => {
          ytResults.appendChild(createGridCard(track));
        });
      }
    });

    // Инициализация
    renderHome();
  </script>
</body>
</html>
