<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>SpotiBox - Spotify & Xbox 360</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1ed760;
      --primary-hover: #1fdf64;
      --neon-cyan: #00f0ff;
      --bg-dark: #09090b;
      --bg-sidebar: #000000;
      --bg-player: #121212;
      --bg-right-panel: #121212;
      --bg-card: rgba(24, 24, 27, 0.75);
      --bg-card-hover: rgba(39, 39, 42, 0.95);
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --sidebar-width: 240px;
      --right-panel-width: 360px;
      --player-height: 90px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* =========================================================
       1. ЛЕВОЕ МЕНЮ (SIDEBAR)
       ========================================================= */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      bottom: var(--player-height);
      background-color: var(--bg-sidebar);
      border-right: 1px solid #1c1c20;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
